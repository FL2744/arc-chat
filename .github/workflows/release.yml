name: Preview release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  macos:
    name: Build macOS preview
    runs-on: macos-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/playwright-browsers
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install portable build dependencies
        run: python -m pip install -r requirements.txt -r requirements-build.txt
      - name: Install packaged Chromium runtime
        run: python -m playwright install chromium
      - name: Build ARC Chat.app
        run: python macos/build.py
      - name: Build self-contained macOS package
        run: python distribution/build_portable.py
      - name: Verify self-contained macOS signature
        run: codesign --verify --deep --strict dist/portable/ARC-Chat.app
      - name: Smoke-test self-contained macOS package
        run: python distribution/smoke_portable.py dist/portable/ARC-Chat.app
      - name: Create archive and checksum
        run: |
          ditto -c -k --sequesterRsrc --keepParent "dist/ARC Chat.app" ARC-Chat-macOS.zip
          shasum -a 256 ARC-Chat-macOS.zip > ARC-Chat-macOS.zip.sha256
          cp dist/portable/ARC-Chat-macOS-Portable.zip .
          cp dist/portable/ARC-Chat-macOS-Portable.zip.sha256 .
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ARC-Chat-macOS
          path: |
            ARC-Chat-macOS.zip
            ARC-Chat-macOS.zip.sha256
            ARC-Chat-macOS-Portable.zip
            ARC-Chat-macOS-Portable.zip.sha256

  windows:
    name: Build Windows portable preview
    runs-on: windows-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/playwright-browsers
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install build/runtime dependencies
        run: python -m pip install -r requirements.txt -r requirements-build.txt
      - name: Install packaged Chromium runtime
        run: python -m playwright install chromium
      - name: Build self-contained Windows package
        run: python distribution/build_portable.py
      - name: Smoke-test self-contained Windows package
        run: python distribution/smoke_portable.py dist/portable/ARC-Chat
      - name: Stage Windows release artifacts
        shell: pwsh
        run: |
          Copy-Item dist/portable/ARC-Chat-Windows-Portable.zip .
          Copy-Item dist/portable/ARC-Chat-Windows-Portable.zip.sha256 .
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ARC-Chat-Windows-Portable
          path: |
            ARC-Chat-Windows-Portable.zip
            ARC-Chat-Windows-Portable.zip.sha256

  source:
    name: Package source and bootstrap previews
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Create source archive and checksum
        run: |
          git archive --format=zip --prefix=arc-chat-${GITHUB_REF_NAME}/ -o ARC-Chat-source.zip HEAD
          sha256sum ARC-Chat-source.zip > ARC-Chat-source.zip.sha256
          python distribution/build_bundles.py Linux
          cp dist/ARC-Chat-Linux.zip dist/ARC-Chat-Linux.zip.sha256 .
      - name: Upload source artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ARC-Chat-source
          path: |
            ARC-Chat-source.zip
            ARC-Chat-source.zip.sha256
            ARC-Chat-Linux.zip
            ARC-Chat-Linux.zip.sha256

  publish:
    name: Publish preview release
    needs: [macos, windows, source]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: ARC-Chat-macOS
          path: release
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: ARC-Chat-Windows-Portable
          path: release
      - name: Download source artifacts
        uses: actions/download-artifact@v4
        with:
          name: ARC-Chat-source
          path: release
      - name: Verify release payload
        shell: bash
        run: |
          set -euo pipefail
          ls -lh release
          for file in \
            ARC-Chat-macOS-Portable.zip \
            ARC-Chat-macOS-Portable.zip.sha256 \
            ARC-Chat-Windows-Portable.zip \
            ARC-Chat-Windows-Portable.zip.sha256 \
            ARC-Chat-macOS.zip \
            ARC-Chat-macOS.zip.sha256 \
            ARC-Chat-source.zip \
            ARC-Chat-source.zip.sha256 \
            ARC-Chat-Linux.zip \
            ARC-Chat-Linux.zip.sha256; do
            test -s "release/$file"
          done
      - name: Publish GitHub release with per-asset retries
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"

          retry() {
            local attempt=1
            local max_attempts=5
            until "$@"; do
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "command failed after ${attempt} attempts: $*" >&2
                return 1
              fi
              sleep_seconds=$((attempt * 5))
              echo "retry ${attempt}/${max_attempts} in ${sleep_seconds}s: $*" >&2
              sleep "$sleep_seconds"
              attempt=$((attempt + 1))
            done
          }

          if gh release view "$tag" >/dev/null 2>&1; then
            retry gh release edit "$tag" --prerelease --title "$tag"
          else
            if ! retry gh release create "$tag" --verify-tag --prerelease --generate-notes --title "$tag"; then
              # A transient view failure can race an already-created partial release.
              retry gh release edit "$tag" --prerelease --title "$tag"
            fi
          fi

          # Publish small assets first so a large portable retry never leaves the
          # whole release empty. Each asset is independently resumable/clobberable.
          files=(
            ARC-Chat-macOS.zip
            ARC-Chat-macOS.zip.sha256
            ARC-Chat-source.zip
            ARC-Chat-source.zip.sha256
            ARC-Chat-Linux.zip
            ARC-Chat-Linux.zip.sha256
            ARC-Chat-macOS-Portable.zip.sha256
            ARC-Chat-Windows-Portable.zip.sha256
            ARC-Chat-macOS-Portable.zip
            ARC-Chat-Windows-Portable.zip
          )

          for file in "${files[@]}"; do
            echo "Publishing $file"
            retry gh release upload "$tag" "release/$file" --clobber
          done

          # Verify the user-facing public download routes without downloading the
          # large payload bodies.
          for file in "${files[@]}"; do
            url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/${file}"
            echo "Verifying $url"
            curl --fail --silent --show-error --location --head \
              --retry 5 --retry-all-errors --retry-delay 3 "$url" >/dev/null
          done
