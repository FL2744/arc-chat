name: Preview release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  macos:
    name: Build macOS preview
    runs-on: macos-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/playwright-browsers
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install portable build dependencies
        run: python -m pip install -r requirements.txt -r requirements-build.txt
      - name: Install packaged Chromium runtime
        run: python -m playwright install chromium
      - name: Build ARC Chat.app
        run: python macos/build.py
      - name: Build self-contained macOS package
        run: python distribution/build_portable.py
      - name: Verify self-contained macOS signature
        run: codesign --verify --deep --strict dist/portable/ARC-Chat.app
      - name: Smoke-test self-contained macOS package
        run: python distribution/smoke_portable.py dist/portable/ARC-Chat.app
      - name: Create archive and checksum
        run: |
          ditto -c -k --sequesterRsrc --keepParent "dist/ARC Chat.app" ARC-Chat-macOS.zip
          shasum -a 256 ARC-Chat-macOS.zip > ARC-Chat-macOS.zip.sha256
          cp dist/portable/ARC-Chat-macOS-Portable.zip .
          cp dist/portable/ARC-Chat-macOS-Portable.zip.sha256 .
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ARC-Chat-macOS
          path: |
            ARC-Chat-macOS.zip
            ARC-Chat-macOS.zip.sha256
            ARC-Chat-macOS-Portable.zip
            ARC-Chat-macOS-Portable.zip.sha256

  windows:
    name: Build Windows portable preview
    runs-on: windows-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/playwright-browsers
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install build/runtime dependencies
        run: python -m pip install -r requirements.txt -r requirements-build.txt
      - name: Install packaged Chromium runtime
        run: python -m playwright install chromium
      - name: Build self-contained Windows package
        run: python distribution/build_portable.py
      - name: Smoke-test self-contained Windows package
        run: python distribution/smoke_portable.py dist/portable/ARC-Chat
      - name: Stage Windows release artifacts
        shell: pwsh
        run: |
          Copy-Item dist/portable/ARC-Chat-Windows-Portable.zip .
          Copy-Item dist/portable/ARC-Chat-Windows-Portable.zip.sha256 .
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ARC-Chat-Windows-Portable
          path: |
            ARC-Chat-Windows-Portable.zip
            ARC-Chat-Windows-Portable.zip.sha256

  source:
    name: Package source and bootstrap previews
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Create source archive and checksum
        run: |
          git archive --format=zip --prefix=arc-chat-${GITHUB_REF_NAME}/ -o ARC-Chat-source.zip HEAD
          sha256sum ARC-Chat-source.zip > ARC-Chat-source.zip.sha256
          python distribution/build_bundles.py Windows Linux
          python distribution/build_student_web.py
          cp dist/ARC-Chat-Windows.zip dist/ARC-Chat-Windows.zip.sha256 .
          cp dist/ARC-Chat-Linux.zip dist/ARC-Chat-Linux.zip.sha256 .
          cp dist/ARC-Chat-Student-Web.zip dist/ARC-Chat-Student-Web.zip.sha256 .
      - name: Upload source artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ARC-Chat-source
          path: |
            ARC-Chat-source.zip
            ARC-Chat-source.zip.sha256
            ARC-Chat-Windows.zip
            ARC-Chat-Windows.zip.sha256
            ARC-Chat-Linux.zip
            ARC-Chat-Linux.zip.sha256
            ARC-Chat-Student-Web.zip
            ARC-Chat-Student-Web.zip.sha256

  publish:
    name: Publish preview release
    needs: [macos, windows, source]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Check out repository for git publication
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: ARC-Chat-macOS
          path: release
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: ARC-Chat-Windows-Portable
          path: release
      - name: Download source artifacts
        uses: actions/download-artifact@v4
        with:
          name: ARC-Chat-source
          path: release
      - name: Verify release payload
        shell: bash
        run: |
          set -euo pipefail
          ls -lh release
          for file in \
            ARC-Chat-macOS-Portable.zip \
            ARC-Chat-macOS-Portable.zip.sha256 \
            ARC-Chat-Windows-Portable.zip \
            ARC-Chat-Windows-Portable.zip.sha256 \
            ARC-Chat-macOS.zip \
            ARC-Chat-macOS.zip.sha256 \
            ARC-Chat-source.zip \
            ARC-Chat-source.zip.sha256 \
            ARC-Chat-Windows.zip \
            ARC-Chat-Windows.zip.sha256 \
            ARC-Chat-Linux.zip \
            ARC-Chat-Linux.zip.sha256 \
            ARC-Chat-Student-Web.zip \
            ARC-Chat-Student-Web.zip.sha256; do
            test -s "release/$file"
          done
      - name: Publish API-free download branch
        shell: bash
        env:
          ASSET_BRANCH: release-assets-${{ github.ref_name }}
        run: |
          set -euo pipefail
          # GitHub's Release API has proven flaky for this repository. Keep the
          # classroom-sized downloads on a normal Git ref instead, using the same
          # authenticated git transport as source pushes. Large self-contained
          # portable bundles remain CI artifacts because Git rejects files >100 MB.
          stage="$(mktemp -d)"
          trap 'rm -rf "$stage"' EXIT

          for file in \
            ARC-Chat-macOS.zip \
            ARC-Chat-macOS.zip.sha256 \
            ARC-Chat-source.zip \
            ARC-Chat-source.zip.sha256 \
            ARC-Chat-Windows.zip \
            ARC-Chat-Windows.zip.sha256 \
            ARC-Chat-Linux.zip \
            ARC-Chat-Linux.zip.sha256 \
            ARC-Chat-Student-Web.zip \
            ARC-Chat-Student-Web.zip.sha256; do
            cp "release/$file" "$stage/$file"
          done

          cat > "$stage/README.md" <<EOF
          # ARC Chat ${GITHUB_REF_NAME} downloads

          These files are the API-free distribution mirror for ARC Chat ${GITHUB_REF_NAME}.
          They were built by GitHub Actions from commit ${GITHUB_SHA} after the release test gates passed.

          - ARC-Chat-Windows.zip - Windows bootstrap
          - ARC-Chat-macOS.zip - macOS bootstrap app
          - ARC-Chat-Linux.zip - Linux bootstrap
          - ARC-Chat-source.zip - source archive
          - ARC-Chat-Student-Web.zip - static browser-first student client for VT Domains-style hosting

          The bootstrap packages require internet access on first launch and install their runtime dependencies/Chromium locally.
          The much larger self-contained Windows/macOS bundles are retained as CI artifacts rather than normal Git objects.
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan "$ASSET_BRANCH"
          git rm -rf .
          cp -a "$stage"/. .
          git add README.md ARC-Chat-*.zip ARC-Chat-*.zip.sha256
          git commit -m "Publish ${GITHUB_REF_NAME} bootstrap downloads"
          git push --force origin "HEAD:refs/heads/$ASSET_BRANCH"

      - name: Verify API-free public downloads
        shell: bash
        env:
          ASSET_BRANCH: release-assets-${{ github.ref_name }}
        run: |
          set -euo pipefail
          for file in \
            ARC-Chat-macOS.zip \
            ARC-Chat-macOS.zip.sha256 \
            ARC-Chat-source.zip \
            ARC-Chat-source.zip.sha256 \
            ARC-Chat-Windows.zip \
            ARC-Chat-Windows.zip.sha256 \
            ARC-Chat-Linux.zip \
            ARC-Chat-Linux.zip.sha256 \
            ARC-Chat-Student-Web.zip \
            ARC-Chat-Student-Web.zip.sha256; do
            url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${ASSET_BRANCH}/${file}"
            echo "Verifying $url"
            curl --fail --silent --show-error --location --head \
              --retry 5 --retry-all-errors --retry-delay 3 "$url" >/dev/null
          done
