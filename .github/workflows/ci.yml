name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.12', '3.14']
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m py_compile helper.py config.py state.py model_providers.py diagnostics.py ood.py workspace.py protocol.py security.py context_window.py artifacts.py jobs.py services.py integration.py errors.py version.py
      - name: Run unit and reconnect tests
        run: python -m unittest discover -s . -p 'test_*.py' -v

  package-check:
    name: Packaging source check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate macOS build script syntax
        run: python -m py_compile macos/build.py macos/launcher.py distribution/build_bundles.py distribution/build_portable.py distribution/pyinstaller_runtime.py distribution/smoke_portable.py
      - name: Verify packaged Python modules are declared
        shell: bash
        run: |
          for file in helper.py config.py state.py model_providers.py diagnostics.py ood.py workspace.py protocol.py security.py context_window.py artifacts.py jobs.py services.py integration.py errors.py version.py arc-chat.html requirements.txt CONTRIBUTORS.md SECURITY.md SUPPORT.md; do
            test -f "$file"
          done
      - name: Build Windows and Linux bootstrap bundles
        run: python distribution/build_bundles.py
      - name: Inspect bootstrap bundle contents
        run: |
          for archive in dist/ARC-Chat-Windows.zip dist/ARC-Chat-Linux.zip; do
            unzip -l "$archive"
            for file in protocol.py security.py context_window.py artifacts.py jobs.py services.py integration.py errors.py version.py CONTRIBUTORS.md SECURITY.md SUPPORT.md; do
              unzip -l "$archive" | grep -q "$file"
            done
          done

  integration:
    name: Local Jupyter integration
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/playwright-browsers
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install runtime/integration dependencies
        run: python -m pip install -r requirements.txt -r requirements-test.txt
      - name: Install Chromium and Linux browser dependencies
        run: python -m playwright install --with-deps chromium
      - name: Run real local Jupyter/UI integration
        run: python integration_test.py

  portable-windows:
    name: Self-contained Windows smoke
    runs-on: windows-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/playwright-browsers
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install build/runtime dependencies
        run: python -m pip install -r requirements.txt -r requirements-build.txt
      - name: Install packaged Chromium runtime
        run: python -m playwright install chromium
      - name: Build self-contained package
        run: python distribution/build_portable.py
      - name: Smoke-test clean packaged launch
        run: python distribution/smoke_portable.py dist/portable/ARC-Chat

  portable-macos:
    name: Self-contained macOS smoke
    runs-on: macos-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/playwright-browsers
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install build/runtime dependencies
        run: python -m pip install -r requirements.txt -r requirements-build.txt
      - name: Install packaged Chromium runtime
        run: python -m playwright install chromium
      - name: Build self-contained package
        run: python distribution/build_portable.py
      - name: Verify macOS app signature
        run: codesign --verify --deep --strict dist/portable/ARC-Chat.app
      - name: Smoke-test clean packaged launch
        run: python distribution/smoke_portable.py dist/portable/ARC-Chat.app
