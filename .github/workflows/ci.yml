name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.12']
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m py_compile helper.py config.py state.py model_providers.py diagnostics.py ood.py workspace.py
      - name: Run unit and reconnect tests
        run: python -m unittest discover -s . -p 'test_*.py' -v

  package-check:
    name: Packaging source check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate macOS build script syntax
        run: python -m py_compile macos/build.py macos/launcher.py distribution/build_bundles.py
      - name: Verify packaged Python modules are declared
        shell: bash
        run: |
          for file in helper.py config.py state.py model_providers.py diagnostics.py ood.py workspace.py arc-chat.html requirements.txt; do
            test -f "$file"
          done
      - name: Build Windows and Linux bootstrap bundles
        run: python distribution/build_bundles.py
      - name: Inspect bootstrap bundle contents
        run: |
          unzip -l dist/ARC-Chat-Windows.zip
          unzip -l dist/ARC-Chat-Linux.zip
